name = "taiheyinghsi"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
minify = true

# 静态资源配置
# Cloudflare Workers Assets 用于服务静态文件
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "moontv-db"
database_id = "d84e063e-de34-41f6-886e-8a7f5383c405"

[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"
